version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: banana-art-backend
    ports:
      - "7588:7588"
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    working_dir: /app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    # command: uvicorn backend.main:app --host 0.0.0.0 --port 7588 --reload
    command: uvicorn backend.main:app --host 0.0.0.0 --port 7588 
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banana-art-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
